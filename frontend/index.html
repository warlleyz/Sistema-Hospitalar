<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sistema Hospitalar</h1>
        <p>Protótipo inicial - Sprint 1</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Pacientes</a>
        <a href="#">Profissionais</a>
        <a href="#">Consultas</a>
        <a href="#">Internações</a>
        <a href="#">Quartos</a>
        <a href="#">Histórico</a>
    </nav>

    <main>
        <h2>Dashboard</h2>
        <p>Visão geral das principais informações do hospital.</p>

        <section class="cards">
            <div class="card">
                <h3>Pacientes</h3>
                <p>12 cadastrados</p>
            </div>

            <div class="card">
                <h3>Consultas</h3>
                <p>5 agendadas</p>
            </div>

            <div class="card">
                <h3>Internações</h3>
                <p>3 pacientes</p>
            </div>

            <div class="card">
                <h3>Quartos</h3>
                <p>8 disponíveis</p>
            </div>
        </section>
    </main>
</body>
</html>
