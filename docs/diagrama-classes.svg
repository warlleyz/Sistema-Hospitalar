<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <style>
    .title { font: 700 30px Arial, sans-serif; fill: #20242c; }
    .subtitle { font: 16px Arial, sans-serif; fill: #555; }
    .box { fill: #fff; stroke: #333; stroke-width: 2; }
    .head { fill: #ececec; stroke: #333; stroke-width: 2; }
    .class-name { font: 700 18px Arial, sans-serif; fill: #222; text-anchor: middle; }
    .attr { font: 14px Arial, sans-serif; fill: #222; }
    .line { stroke: #444; stroke-width: 1.7; fill: none; }
    .mult { font: 13px Arial, sans-serif; fill: #222; }
  </style>

  <rect width="1400" height="820" fill="#fafafa"/>
  <text x="700" y="42" class="title" text-anchor="middle">Sistema Hospitalar - Diagrama de Classes</text>
  <text x="700" y="68" class="subtitle" text-anchor="middle">Sprint 1</text>

  <!-- Paciente -->
  <rect x="60" y="120" width="320" height="230" class="box"/>
  <rect x="60" y="120" width="320" height="42" class="head"/>
  <text x="220" y="147" class="class-name">Paciente</text>
  <text x="78" y="190" class="attr">- nome: String</text>
  <text x="78" y="216" class="attr">- cpf: String</text>
  <text x="78" y="242" class="attr">- dataNascimento: LocalDate</text>
  <text x="78" y="268" class="attr">- telefone: String</text>
  <text x="78" y="294" class="attr">- endereco: String</text>
  <text x="78" y="320" class="attr">- email: String</text>

  <!-- Consulta -->
  <rect x="540" y="105" width="320" height="185" class="box"/>
  <rect x="540" y="105" width="320" height="42" class="head"/>
  <text x="700" y="132" class="class-name">Consulta</text>
  <text x="558" y="175" class="attr">- data: LocalDate</text>
  <text x="558" y="201" class="attr">- horario: LocalTime</text>
  <text x="558" y="227" class="attr">- motivo: String</text>
  <text x="558" y="253" class="attr">- observacoesMedicas: String</text>

  <!-- Profissional -->
  <rect x="1020" y="120" width="320" height="210" class="box"/>
  <rect x="1020" y="120" width="320" height="42" class="head"/>
  <text x="1180" y="147" class="class-name">ProfissionalSaude</text>
  <text x="1038" y="190" class="attr">- nome: String</text>
  <text x="1038" y="216" class="attr">- registroProfissional: String</text>
  <text x="1038" y="242" class="attr">- especialidade: String</text>
  <text x="1038" y="268" class="attr">- telefone: String</text>
  <text x="1038" y="294" class="attr">- email: String</text>

  <!-- Historico -->
  <rect x="60" y="500" width="320" height="110" class="box"/>
  <rect x="60" y="500" width="320" height="42" class="head"/>
  <text x="220" y="527" class="class-name">HistoricoMedico</text>
  <text x="78" y="574" class="attr">- paciente: Paciente</text>

  <!-- Internacao -->
  <rect x="540" y="465" width="320" height="205" class="box"/>
  <rect x="540" y="465" width="320" height="42" class="head"/>
  <text x="700" y="492" class="class-name">Internacao</text>
  <text x="558" y="535" class="attr">- dataEntrada: LocalDate</text>
  <text x="558" y="561" class="attr">- dataPrevistaAlta: LocalDate</text>
  <text x="558" y="587" class="attr">- dataEfetivaAlta: LocalDate</text>
  <text x="558" y="613" class="attr">- observacoes: String</text>

  <!-- Quarto -->
  <rect x="1020" y="500" width="320" height="185" class="box"/>
  <rect x="1020" y="500" width="320" height="42" class="head"/>
  <text x="1180" y="527" class="class-name">Quarto</text>
  <text x="1038" y="570" class="attr">- numeroIdentificacao: String</text>
  <text x="1038" y="596" class="attr">- andar: int</text>
  <text x="1038" y="622" class="attr">- capacidadeMaxima: int</text>
  <text x="1038" y="648" class="attr">- situacaoAtual: String</text>

  <!-- Paciente / Consulta -->
  <line x1="380" y1="215" x2="540" y2="215" class="line"/>
  <text x="394" y="202" class="mult">1</text>
  <text x="504" y="202" class="mult">0..*</text>

  <!-- Consulta / Profissional -->
  <line x1="860" y1="215" x2="1020" y2="215" class="line"/>
  <text x="872" y="202" class="mult">0..*</text>
  <text x="997" y="202" class="mult">1</text>

  <!-- Paciente / Historico -->
  <line x1="220" y1="350" x2="220" y2="500" class="line"/>
  <text x="232" y="375" class="mult">1</text>
  <text x="232" y="485" class="mult">1</text>

  <!-- Historico / Consulta -->
  <path d="M 380 540 L 455 540 L 455 290 L 540 290" class="line"/>
  <text x="391" y="527" class="mult">1</text>
  <text x="504" y="278" class="mult">0..*</text>

  <!-- Historico / Internacao -->
  <line x1="380" y1="590" x2="540" y2="590" class="line"/>
  <text x="392" y="577" class="mult">1</text>
  <text x="504" y="577" class="mult">0..*</text>

  <!-- Paciente / Internacao -->
  <path d="M 340 350 L 420 350 L 420 440 L 525 440 L 525 520 L 540 520" class="line"/>
  <text x="353" y="338" class="mult">1</text>
  <text x="502" y="507" class="mult">0..*</text>

  <!-- Profissional / Internacao -->
  <path d="M 1160 330 L 1160 400 L 925 400 L 925 520 L 860 520" class="line"/>
  <text x="1140" y="355" class="mult">1</text>
  <text x="870" y="507" class="mult">0..*</text>

  <!-- Internacao / Quarto -->
  <line x1="860" y1="590" x2="1020" y2="590" class="line"/>
  <text x="872" y="577" class="mult">0..*</text>
  <text x="996" y="577" class="mult">1</text>
</svg>
